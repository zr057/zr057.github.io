<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">FollowMe validation summary</title>
  <desc id="desc">Trajectory roughness decreased from 0.0384 metres to 0.0100 metres after filtering, and the mean following distance was 1.39 metres within the 1.0 to 1.5 metre target interval.</desc>
  <rect width="1200" height="520" rx="28" fill="#f6f9fc"/>
  <rect x="28" y="28" width="556" height="464" rx="22" fill="#ffffff" stroke="#d8e3ec"/>
  <rect x="616" y="28" width="556" height="464" rx="22" fill="#ffffff" stroke="#d8e3ec"/>

  <text x="68" y="83" fill="#0f2d4a" font-family="Arial, sans-serif" font-size="25" font-weight="700">UWB trajectory smoothing</text>
  <text x="68" y="116" fill="#5d7084" font-family="Arial, sans-serif" font-size="17">Mean roughness across nine measured trajectories</text>
  <line x1="102" y1="407" x2="526" y2="407" stroke="#cbd8e3" stroke-width="2"/>
  <rect x="154" y="184" width="112" height="223" rx="8" fill="#9fb6ca"/>
  <rect x="355" y="349" width="112" height="58" rx="8" fill="#1769aa"/>
  <text x="210" y="165" text-anchor="middle" fill="#0f2d4a" font-family="Arial, sans-serif" font-size="24" font-weight="700">0.0384 m</text>
  <text x="411" y="330" text-anchor="middle" fill="#1769aa" font-family="Arial, sans-serif" font-size="24" font-weight="700">0.0100 m</text>
  <text x="210" y="444" text-anchor="middle" fill="#5d7084" font-family="Arial, sans-serif" font-size="18">Raw</text>
  <text x="411" y="444" text-anchor="middle" fill="#5d7084" font-family="Arial, sans-serif" font-size="18">Filtered</text>
  <rect x="365" y="137" width="151" height="42" rx="21" fill="#e5f1fa"/>
  <text x="440" y="165" text-anchor="middle" fill="#1769aa" font-family="Arial, sans-serif" font-size="18" font-weight="700">−73.04%</text>

  <text x="656" y="83" fill="#0f2d4a" font-family="Arial, sans-serif" font-size="25" font-weight="700">Following-distance stability</text>
  <text x="656" y="116" fill="#5d7084" font-family="Arial, sans-serif" font-size="17">Mean distance compared with the intended interval</text>
  <line x1="688" y1="294" x2="1103" y2="294" stroke="#b9c9d7" stroke-width="12" stroke-linecap="round"/>
  <line x1="895" y1="294" x2="1050" y2="294" stroke="#7bc5a0" stroke-width="18" stroke-linecap="round"/>
  <line x1="1016" y1="238" x2="1016" y2="350" stroke="#1769aa" stroke-width="5"/>
  <circle cx="1016" cy="294" r="12" fill="#1769aa"/>
  <text x="1016" y="213" text-anchor="middle" fill="#1769aa" font-family="Arial, sans-serif" font-size="27" font-weight="700">1.39 m</text>
  <text x="688" y="337" text-anchor="middle" fill="#5d7084" font-family="Arial, sans-serif" font-size="16">0.0</text>
  <text x="895" y="337" text-anchor="middle" fill="#397a5b" font-family="Arial, sans-serif" font-size="16">1.0</text>
  <text x="1050" y="337" text-anchor="middle" fill="#397a5b" font-family="Arial, sans-serif" font-size="16">1.5</text>
  <text x="1103" y="337" text-anchor="middle" fill="#5d7084" font-family="Arial, sans-serif" font-size="16">1.7 m</text>
  <rect x="821" y="383" width="252" height="45" rx="22" fill="#e8f5ee"/>
  <text x="947" y="412" text-anchor="middle" fill="#397a5b" font-family="Arial, sans-serif" font-size="18" font-weight="700">Inside the 1.0–1.5 m target band</text>
</svg>
